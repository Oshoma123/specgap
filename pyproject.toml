[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specgap"
version = "0.3.0"
description = "Assessing the coverage of public mass spectral libraries against natural-product structure databases"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Oshoma Erumiseli", email = "Erumiseli.oshomag@gmail.com"}]
keywords = ["metabolomics", "mass spectrometry", "natural products", "spectral libraries", "cheminformatics"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.5"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Oshoma123/specgap"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
